<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}Workout Tracker{% endblock %}</title>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
      <header class="flex items-center justify-between mb-6">
        <a href="/" class="text-xl font-bold">Workout Tracker</a>

        {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}" style="display: inline;">
          {% csrf_token %}
          <button type="submit" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold">
            Logout
          </button>
        </form>
        {% endif %}
      </header>

      {% if user.is_authenticated %}
      <div class="text-center mb-8">
        <div class="text-slate-400 text-lg">Hi, <span class="text-slate-200 font-semibold">{{ user.username }}</span></div>
        <div class="text-3xl font-bold text-indigo-400 mt-2">Let's Train!</div>
      </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
