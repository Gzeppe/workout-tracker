{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <title>{% block title %}Workout Tracker{% endblock %}</title>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
      <header class="mb-6">
        <!-- Navigation -->
        <div class="flex justify-end gap-3 mb-4">
          <a href="{% url 'about' %}" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold">
            About
          </a>
          {% if user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold">
              Logout
            </button>
          </form>
          {% endif %}
        </div>

        <!-- Centered Logo -->
        <div class="text-center mb-6">
          <a href="/">
            <img src="{% static 'images/logo.png' %}" alt="Workout Tracker" class="h-32 mx-auto">
          </a>
        </div>
      </header>

      {% if user.is_authenticated %}
      <div class="text-center mb-8">
        <div class="text-slate-400 text-lg">Hi, <span class="text-slate-200 font-semibold">{{ user.username }}</span></div>
        <div class="text-3xl font-bold text-indigo-400 mt-2">Start Tracking Your Workouts!</div>
      </div>
      {% endif %}

      {% block content %}{% endblock %}

      <!-- Footer -->
      <div class="text-center mt-8 py-4 text-slate-500 text-sm">
        Built by <span class="text-slate-300 font-semibold">Gtech LLC</span>
      </div>
    </div>
  </body>
</html>
