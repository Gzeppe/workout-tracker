{% extends "base.html" %}
{% block title %}Start Weightlifting - Workout Tracker{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-[#FFF8F0]/5 rounded-2xl p-6 shadow-sm border border-[#FFF8F0]/10">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-[#FFF8F0]/5 flex items-center justify-center">
        <svg class="w-6 h-6 text-[#FFF8F0]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h2v12H4zM18 6h2v12h-2zM6 11h12v2H6zM2 9h2v6H2zM20 9h2v6h-2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-[#FFF8F0]">Start Weightlifting</h1>
    </div>

    <form method="post" class="space-y-6">
      {% csrf_token %}

      {% if templates %}
      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Use Template (Optional)</span>
          <select name="template_id" class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none">
            <option value="">-- Start Fresh --</option>
            {% for t in templates %}
              <option value="{{ t.id }}">{{ t.name }}{% if t.day %} ({{ t.day }}){% endif %}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      {% endif %}

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Muscle Group</span>
          <select name="day" class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" required>
            <option value="" selected disabled>Select muscle group...</option>
            {% for d in days %}
              <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Custom Name (Optional)</span>
          <input type="text" name="name" placeholder="e.g., Morning Push Day"
                 class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" />
        </label>
      </div>

      <div>
        <div class="font-semibold mb-2 text-[#FFF8F0]/80">Energy Level</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          {% for m in moods %}
            <label class="bg-[#FFF8F0]/5 hover:bg-[#FFF8F0]/10 rounded-xl p-3 cursor-pointer flex items-center gap-2 border border-[#FFF8F0]/10 transition-colors">
              <input type="radio" name="mood" value="{{ m }}" class="text-[#FFF8F0]" required />
              <span class="text-[#FFF8F0]">{{ m }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="submit"
                class="flex-1 px-5 py-3 rounded-xl bg-[#00B7FF] hover:bg-[#009AD8] text-white font-semibold shadow-lg shadow-[#00B7FF]/25 transition-all duration-200">
          Start Workout
        </button>
        <a href="{% url 'select_workout_type' %}"
           class="px-5 py-3 rounded-xl bg-[#FFF8F0]/5 hover:bg-[#FFF8F0]/10 font-semibold transition-colors">
          Back
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
