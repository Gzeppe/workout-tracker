{% extends "base.html" %}
{% block title %}Start Cardio - Workout Tracker{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-[#FFF8F0]/5 rounded-2xl p-6 shadow-sm border border-[#FFF8F0]/10">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-[#FFF8F0]/5 flex items-center justify-center">
        <svg class="w-6 h-6 text-[#FFF8F0]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-[#FFF8F0]">Start Cardio Workout</h1>
    </div>

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Cardio Type</span>
          <select name="cardio_type" class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" required>
            <option value="" selected disabled>Select cardio type...</option>
            {% for value, label in cardio_types %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Equipment (Optional)</span>
          <input type="text" name="equipment" placeholder="e.g., Treadmill, Outdoor, Stationary Bike"
                 class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" />
        </label>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block">
            <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Target Duration (min)</span>
            <input type="number" name="target_duration" min="0" placeholder="30"
                   class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" />
          </label>
        </div>
        <div>
          <label class="block">
            <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Target Distance (miles)</span>
            <input type="number" name="target_distance" min="0" step="0.1" placeholder="3.0"
                   class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" />
          </label>
        </div>
      </div>

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-[#FFF8F0]/80">Custom Name (Optional)</span>
          <input type="text" name="name" placeholder="e.g., Morning Run"
                 class="w-full bg-[#FFF8F0]/[0.08] rounded-xl p-3 border border-[#FFF8F0]/10 focus:border-[#00B7FF] focus:outline-none" />
        </label>
      </div>

      <div>
        <div class="font-semibold mb-2 text-[#FFF8F0]/80">Energy Level</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          {% for m in moods %}
            <label class="bg-[#FFF8F0]/5 hover:bg-[#FFF8F0]/10 rounded-xl p-3 cursor-pointer flex items-center gap-2 border border-[#FFF8F0]/10 transition-colors">
              <input type="radio" name="mood" value="{{ m }}" class="text-[#FFF8F0]" required />
              <span class="text-[#FFF8F0]">{{ m }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="submit"
                class="flex-1 px-5 py-3 rounded-xl bg-[#00B7FF] hover:bg-[#009AD8] text-white font-semibold shadow-lg shadow-[#00B7FF]/25 transition-all duration-200">
          Start Cardio
        </button>
        <a href="{% url 'select_workout_type' %}"
           class="px-5 py-3 rounded-xl bg-[#FFF8F0]/5 hover:bg-[#FFF8F0]/10 font-semibold transition-colors">
          Back
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
