{% extends "base.html" %}
{% block title %}Start Cardio - Workout Tracker{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-slate-900 rounded-2xl p-6 shadow border border-red-700/20">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-red-700/20 flex items-center justify-center">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-slate-100">Start Cardio Workout</h1>
    </div>

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-slate-300">Cardio Type</span>
          <select name="cardio_type" class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700 focus:border-red-700 focus:outline-none" required>
            <option value="" selected disabled>Select cardio type...</option>
            {% for value, label in cardio_types %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-slate-300">Equipment (Optional)</span>
          <input type="text" name="equipment" placeholder="e.g., Treadmill, Outdoor, Stationary Bike"
                 class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700 focus:border-red-700 focus:outline-none" />
        </label>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block">
            <span class="font-semibold mb-2 block text-slate-300">Target Duration (min)</span>
            <input type="number" name="target_duration" min="0" placeholder="30"
                   class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700 focus:border-red-700 focus:outline-none" />
          </label>
        </div>
        <div>
          <label class="block">
            <span class="font-semibold mb-2 block text-slate-300">Target Distance (miles)</span>
            <input type="number" name="target_distance" min="0" step="0.1" placeholder="3.0"
                   class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700 focus:border-red-700 focus:outline-none" />
          </label>
        </div>
      </div>

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block text-slate-300">Custom Name (Optional)</span>
          <input type="text" name="name" placeholder="e.g., Morning Run"
                 class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700 focus:border-red-700 focus:outline-none" />
        </label>
      </div>

      <div>
        <div class="font-semibold mb-2 text-slate-300">Energy Level</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          {% for m in moods %}
            <label class="bg-slate-800 hover:bg-slate-700 rounded-xl p-3 cursor-pointer flex items-center gap-2 border border-slate-700 transition-colors">
              <input type="radio" name="mood" value="{{ m }}" class="text-red-700" required />
              <span class="text-slate-200">{{ m }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="submit"
                class="flex-1 px-5 py-3 rounded-xl bg-gradient-to-r from-red-700 to-red-700 hover:from-red-700 hover:to-red-500 font-semibold shadow-lg shadow-red-700/25 transition-all duration-200">
          Start Cardio
        </button>
        <a href="{% url 'select_workout_type' %}"
           class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold transition-colors">
          Back
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
