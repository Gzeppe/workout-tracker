{% extends "base.html" %}
{% block title %}Start Workout{% endblock %}
{% block content %}
  <div class="bg-slate-900 rounded-2xl p-6 shadow">
    <div class="flex items-start justify-between gap-4 mb-6">
      <h1 class="text-2xl font-semibold">Start Workout</h1>

      <a href="{% url 'dashboard' %}"
         class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold">
        Back to dashboard
      </a>
    </div>

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block">
          <span class="font-semibold mb-2 block">Workout Day</span>
          <select name="day" class="w-full bg-slate-800 rounded-xl p-3" required>
            <option value="" selected disabled>Select workout day...</option>
            {% for d in days %}
              <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div>
        <div class="font-semibold mb-2">Energy Level</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          {% for m in moods %}
            <label class="bg-slate-800 hover:bg-slate-700 rounded-xl p-3 cursor-pointer flex items-center gap-2">
              <input type="radio" name="mood" value="{{ m }}" required />
              <span>{{ m }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <button class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold">
        Start
      </button>
    </form>
  </div>
{% endblock %}
