{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
  <div class="bg-slate-900 rounded-2xl p-6 shadow max-w-md mx-auto">
    <h1 class="text-2xl font-semibold mb-6">Login</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <label class="block">
        <span class="text-slate-300 text-sm">Username</span>
        <input type="text" name="username" autofocus
               class="w-full bg-slate-800 rounded-xl p-3 mt-1" required>
      </label>

      <label class="block">
        <span class="text-slate-300 text-sm">Password</span>
        <input type="password" name="password"
               class="w-full bg-slate-800 rounded-xl p-3 mt-1" required>
      </label>

      {% if form.errors %}
        <div class="bg-rose-900/40 border border-rose-700 rounded-xl p-3 text-sm text-rose-200">
          Invalid username or password.
        </div>
      {% endif %}

      <button class="w-full px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold">
        Login
      </button>
    </form>

    <div class="mt-4 text-center text-slate-400 text-sm">
      Don't have an account?
      <a href="{% url 'register' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold">
        Sign up
      </a>
    </div>
  </div>
{% endblock %}
