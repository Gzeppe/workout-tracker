{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
  <div class="bg-slate-900 rounded-2xl p-6 shadow max-w-md mx-auto">
    <h1 class="text-2xl font-semibold mb-6">Create Account</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <label class="block">
        <span class="text-slate-300 text-sm">Username</span>
        <input type="text" name="username" value="{{ username }}" autofocus
               class="w-full bg-slate-800 rounded-xl p-3 mt-1" required>
        <span class="text-slate-500 text-xs">Letters, numbers, and underscores only. 3-30 characters.</span>
      </label>

      <label class="block">
        <span class="text-slate-300 text-sm">Email</span>
        <input type="email" name="email" value="{{ email }}"
               class="w-full bg-slate-800 rounded-xl p-3 mt-1" required>
        <span class="text-slate-500 text-xs">Used for password recovery.</span>
      </label>

      <label class="block">
        <span class="text-slate-300 text-sm">Password</span>
        <input type="password" name="password"
               class="w-full bg-slate-800 rounded-xl p-3 mt-1" required>
        <span class="text-slate-500 text-xs">At least 8 characters. Avoid common passwords.</span>
      </label>

      <label class="block">
        <span class="text-slate-300 text-sm">Confirm Password</span>
        <input type="password" name="password_confirm"
               class="w-full bg-slate-800 rounded-xl p-3 mt-1" required>
      </label>

      {% if errors %}
        <div class="bg-rose-900/40 border border-rose-700 rounded-xl p-3 text-sm text-rose-200">
          <ul class="list-disc list-inside space-y-1">
            {% for error in errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <button class="w-full px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold">
        Sign Up
      </button>
    </form>

    <div class="mt-4 text-center text-slate-400 text-sm">
      Already have an account?
      <a href="{% url 'login' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold">
        Login
      </a>
    </div>
  </div>
{% endblock %}
