{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}

<div class="bg-[#FFF8F0]/5 rounded-2xl p-6 shadow max-w-md mx-auto text-center">
  <h1 class="text-2xl font-semibold mb-2 text-[#FFF8F0]">Password Reset Complete</h1>
  <p class="text-[#FFF8F0]/50 text-sm mb-6">
    Your password has been successfully reset. You can now log in with your new password.
  </p>

  <a href="{% url 'login' %}" class="inline-block w-full px-5 py-3 rounded-xl bg-[#00B7FF] hover:bg-[#009AD8] text-white font-semibold">
    Login
  </a>
</div>

{% endblock %}
