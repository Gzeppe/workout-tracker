{% for s in sets %}
  <div class="bg-slate-800 rounded-xl p-3 flex items-start justify-between gap-3">
    <div class="flex-1">
      <div class="font-semibold">{{ s.exercise.name }} | {{ s.exercise.equipment }}</div>
      <div class="text-slate-300 text-sm">
        Set {{ s.set_number }} — {{ s.weight_lb }} lb x {{ s.reps }} — {{ s.quality|capfirst }}
      </div>
    </div>

    <div class="flex gap-1 items-center">
      <!-- Move buttons -->
      <form method="post" action="{% url 'move_set' s.id %}" hx-post="{% url 'move_set' s.id %}" hx-target="#sets-container" hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="direction" value="up">
        <button type="submit" class="px-2 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs" title="Move up">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
        </button>
      </form>
      <form method="post" action="{% url 'move_set' s.id %}" hx-post="{% url 'move_set' s.id %}" hx-target="#sets-container" hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="direction" value="down">
        <button type="submit" class="px-2 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs" title="Move down">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
      </form>

      <a href="{% url 'edit_set' s.id %}"
         class="px-3 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm font-semibold">
        Edit
      </a>

      <form method="post" action="{% url 'delete_set' s.id %}" hx-post="{% url 'delete_set' s.id %}" hx-target="#sets-container" hx-swap="innerHTML">
        {% csrf_token %}
        <button type="submit"
                class="px-3 py-2 rounded-xl bg-rose-700 hover:bg-rose-600 text-sm font-semibold">
          Delete
        </button>
      </form>
    </div>
  </div>
{% empty %}
  <div class="text-slate-400">No sets yet.</div>
{% endfor %}
