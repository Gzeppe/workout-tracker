[phases.setup]
nixPkgs = ["python310"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "cd web && python manage.py collectstatic --noinput"
]

[start]
cmd = "cd web && python manage.py migrate && python manage.py load_exercises && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
