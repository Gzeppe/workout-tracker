[variables]
PYTHONUNBUFFERED = "1"

[phases.setup]
nixPkgs = ["python310", "python310Packages.pip", "postgresql"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install -r requirements.txt"]

[phases.build]
cmds = ["cd web && python manage.py collectstatic --noinput"]

[start]
cmd = "bash start.sh"
